  <line x1="287" y1="297" x2="287" y2="374" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process outer box -->
  <rect x="28" y="333" width="1480" height="622" rx="10" fill="white" stroke="black" stroke-width="2"/>
