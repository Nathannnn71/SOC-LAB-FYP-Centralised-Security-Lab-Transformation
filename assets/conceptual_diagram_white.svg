  <rect x="797" y="380" width="300" height="200" rx="8" fill="white" stroke="black" stroke-width="2"/>
  <text x="817" y="408" font-size="15" font-weight="bold" fill="black">Processing Layer</text>
  <rect x="812" y="422" width="270" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="947" y="446" text-anchor="middle" font-size="13" fill="black">Deployment verification</text>
  <rect x="812" y="474" width="270" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
