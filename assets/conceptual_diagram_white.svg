  <rect x="148" y="786" width="250" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="273" y="810" text-anchor="middle" font-size="13" fill="black">Resolves recipe dependencies</text>

  <line x1="413" y1="747" x2="489" y2="747" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

