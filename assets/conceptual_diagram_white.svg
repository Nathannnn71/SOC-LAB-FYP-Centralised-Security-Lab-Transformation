  <text x="1203" y="628" font-size="15" font-weight="bold" fill="black">Output variables</text>
  <rect x="1198" y="642" width="240" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1318" y="666" text-anchor="middle" font-size="13" fill="black">Assembled lab environments</text>
  <rect x="1198" y="694" width="240" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1318" y="718" text-anchor="middle" font-size="13" fill="black">Console access (VNC)</text>
  <rect x="1198" y="746" width="240" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1318" y="770" text-anchor="middle" font-size="13" fill="black">Logs and status</text>
  <rect x="1198" y="798" width="240" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1318" y="822" text-anchor="middle" font-size="13" fill="black">Configured lab activities</text>

  <!-- Arrow Output variables -> Outcome (exits Process box upward) -->
  <line x1="1318" y1="600" x2="1318" y2="302" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outcome -->
  <rect x="1148" y="68" width="333" height="230" rx="8" fill="white" stroke="black" stroke-width="2"/>
  <text x="1168" y="96" font-size="15" font-weight="bold" fill="black">Outcome</text>
  <rect x="1163" y="110" width="303" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1314" y="134" text-anchor="middle" font-size="13" fill="black">Hands-on learning</text>
  <rect x="1163" y="162" width="303" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1314" y="186" text-anchor="middle" font-size="13" fill="black">Reduced lab-prep time</text>
  <rect x="1163" y="214" width="303" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1314" y="238" text-anchor="middle" font-size="13" fill="black">Reusable scalable labs</text>

</svg>
