  <rect x="508" y="734" width="210" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="613" y="758" text-anchor="middle" font-size="13" fill="black">Ansible recipe application</text>
  <rect x="508" y="786" width="210" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="613" y="810" text-anchor="middle" font-size="13" fill="black">VLAN and guest configuration</text>

  <!-- Elbow arrow Execution -> Processing -->
  <polyline points="613,640 613,460 793,460" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Storage Layer -->
  <rect x="797" y="640" width="300" height="215" rx="8" fill="white" stroke="black" stroke-width="2"/>
  <text x="817" y="668" font-size="15" font-weight="bold" fill="black">Storage Layer</text>
  <rect x="812" y="682" width="270" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="947" y="706" text-anchor="middle" font-size="13" fill="black">Version Control (Git)</text>
  <rect x="812" y="734" width="270" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="947" y="758" text-anchor="middle" font-size="13" fill="black">Logging system</text>
  <rect x="812" y="786" width="270" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="947" y="810" text-anchor="middle" font-size="13" fill="black">Lab access store</text>

  <line x1="1097" y1="747" x2="1179" y2="747" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

