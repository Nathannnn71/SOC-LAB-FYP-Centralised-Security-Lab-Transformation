<svg viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1536" height="1024" fill="white"/>

  <text x="768" y="45" text-anchor="middle" font-size="26" font-weight="bold" letter-spacing="2" fill="black">CONCEPTUAL DIAGRAM</text>

  <!-- Lab Infrastructure -->
  <rect x="135" y="105" width="305" height="92" rx="8" fill="white" stroke="black" stroke-width="2"/>
  <text x="287" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="black">Lab Infrastructure</text>
  <text x="287" y="162" text-anchor="middle" font-size="13" fill="black">Network, VMs, SOC, Proxmox cluster</text>

  <line x1="287" y1="197" x2="287" y2="246" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- System Development -->
  <rect x="135" y="250" width="305" height="47" rx="8" fill="white" stroke="black" stroke-width="2"/>
