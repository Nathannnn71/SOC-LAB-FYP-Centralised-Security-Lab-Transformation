  <rect x="148" y="422" width="250" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="273" y="446" text-anchor="middle" font-size="13" fill="black">VM templates</text>
  <rect x="148" y="474" width="250" height="38" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
