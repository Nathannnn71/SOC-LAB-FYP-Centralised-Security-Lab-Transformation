<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FYP-1B Networking — SOC Lab FYP</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0e17; --surface:#101622; --panel:#161e30; --border:#253650;
  --text:#ddeeff; --muted:#6a85a8; --bright:#f0f8ff;
  --c1a:#00e5ff; --c1b:#b388ff; --c1c:#ffa726;
  --c2a:#69f0ae; --c2b:#ff5252; --c2c:#448aff;
  --c3a:#ffd740; --c3b:#f06292; --c3c:#b2ff59;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:16px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.4}

/* HEADER */
header{border-bottom:1px solid var(--border);padding:0 2.5rem;position:sticky;top:0;z-index:100;background:rgba(10,14,23,.92);backdrop-filter:blur(12px);display:flex;align-items:center;gap:1.5rem;height:60px}
.logo-badge{font-family:'Share Tech Mono',monospace;font-size:.78rem;letter-spacing:.15em;color:var(--c2a);border:1px solid var(--c2a);padding:.25rem .6rem;border-radius:3px;white-space:nowrap;text-decoration:none}
header h1{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:700;color:var(--bright);letter-spacing:.04em;flex:1}
.nav-tabs{display:flex;gap:.25rem}
.nav-tab{font-family:'Share Tech Mono',monospace;font-size:.72rem;letter-spacing:.08em;padding:.35rem .75rem;border:1px solid transparent;border-radius:3px;cursor:pointer;background:none;color:var(--muted);transition:all .2s;white-space:nowrap;text-decoration:none;display:inline-block}
.nav-tab:hover{color:var(--bright);border-color:var(--border)}
.nav-tab.active{color:var(--bright);background:var(--panel);border-color:var(--border)}

/* PAGE */
.candidate-page{max-width:1000px;margin:0 auto;padding:2.5rem}

/* CANDIDATE HEADER */
.candidate-header{display:flex;align-items:flex-start;gap:1.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border);margin-bottom:2rem}
.candidate-badge{font-family:'Barlow Condensed',sans-serif;font-size:2.4rem;font-weight:900;border:2px solid;border-radius:6px;padding:.5rem 1rem;white-space:nowrap;line-height:1;flex-shrink:0;text-align:center}
.candidate-meta{flex:1}
.candidate-meta h2{font-family:'Barlow Condensed',sans-serif;font-size:2.1rem;font-weight:900;line-height:1.1;color:var(--bright);margin-bottom:.5rem}
.candidate-meta .course-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.course-tag{font-family:'Share Tech Mono',monospace;font-size:.7rem;padding:.25rem .6rem;border:1px solid var(--border);border-radius:2px;color:var(--muted)}
.candidate-name-block{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:.85rem 1.1rem;font-family:'Share Tech Mono',monospace;font-size:.76rem;color:var(--muted);white-space:nowrap}
.candidate-name-block strong{color:var(--bright);font-size:.9rem;display:block;margin:.25rem 0}

/* INFO BLOCK */
.info-block{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:1.6rem;margin-bottom:1.4rem;position:relative}
.info-block .block-label{font-family:'Share Tech Mono',monospace;font-size:.72rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.info-block .block-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* PROBLEM STATEMENT */
.scope-list{list-style:none;font-size:1rem;line-height:1.75}
.scope-list li{display:flex;align-items:flex-start;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--border)}
.scope-list li:last-child{border-bottom:none}
